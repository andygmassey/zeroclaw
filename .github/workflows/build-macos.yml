# macOS release pipeline for the Ostler assistant binary.
#
# On a tag push matching v* (e.g. v0.1, v0.2.3) builds the
# aarch64-apple-darwin release binary from this workspace, strips
# it, tars it as `ostler-assistant-aarch64-apple-darwin-<version>
# .tar.gz`, and attaches the tarball to the corresponding GitHub
# Release.
#
# Customer-facing rename: `cargo build` produces
# `target/aarch64-apple-darwin/release/zeroclaw` (the workspace
# `[[bin]]` is unchanged because renaming it would cascade into
# the upstream Dockerfiles, install.sh, marketplace, and AUR/Scoop
# pipelines -- out of scope for v0.1). The tarball ships the same
# bytes under the customer-facing name `ostler-assistant`. CM051's
# installer extracts it to `${OSTLER_DIR}/bin/ostler-assistant`.
#
# Code-signing is intentionally not done here. Andy's Developer ID
# work is task #136 (post-launch); v0.1 ships unsigned. The release
# notes generated by this workflow flag that.
#
# Multi-arch is NOT used here. Customer Macs are arm64; an Intel
# fallback would just slow the pipeline. Add x86_64 later if a
# customer reports needing it.

name: Build macOS assistant binary

on:
  push:
    tags:
      - 'v*'

# Serialise per-tag so a fast follow-up retag does not race the
# in-flight build. cancel-in-progress is false because we want a
# clean upload; aborting mid-tar would leave a partial release
# asset.
concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build aarch64-apple-darwin binary
    runs-on: macos-14
    timeout-minutes: 45

    permissions:
      # contents:write is required by softprops/action-gh-release to
      # attach the tarball to the GitHub Release for this tag.
      contents: write

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      TARGET: aarch64-apple-darwin

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Match the toolchain pinned by the existing
      # cross-platform-build-manual workflow so any rustc-version-
      # sensitive deps behave identically across release flows.
      - name: Set up Rust toolchain (1.93.0, with target)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: aarch64-apple-darwin

      - name: Set up cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-aarch64-release

      # Build the web/ dashboard assets that the gateway feature
      # serves. Other workflows in this repo build it as a separate
      # job and download it as an artifact; we run it inline because
      # this workflow only produces one binary -- the artifact dance
      # adds latency without isolating anything useful here.
      - name: Build web dashboard
        run: |
          cd web
          npm ci
          npm run build

      # Default features include `agent-runtime`, which pulls in
      # `channel-imessage` and `channel-email` -- the two channels
      # the v0.1 launch supports per the brief. WhatsApp Web is
      # gated behind the `whatsapp-web` feature and is post-launch
      # for the customer install (Phase 0.5 pieces 2+3 will revisit
      # which channels the assistant binary needs to ship enabled).
      - name: Build release binary
        run: |
          cargo build \
            --release \
            --locked \
            --target "$TARGET"

      # Confirm the built binary actually produces a sensible
      # version line before we tar it. Catches "build succeeded but
      # the binary won't start on this runner" early.
      - name: Verify binary runs
        run: |
          ./target/$TARGET/release/zeroclaw --version

      - name: Extract version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then
            echo "ERROR: tag '$GITHUB_REF_NAME' does not match v* shape" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Customer-facing rename happens at tar time. The Cargo.toml
      # `[[bin]]` stays as `zeroclaw` to keep upstream Dockerfiles
      # / install.sh / marketplace working unchanged.
      - name: Strip and tar
        id: artifact
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          stage="$(mktemp -d)"
          cp "target/$TARGET/release/zeroclaw" "$stage/ostler-assistant"
          strip "$stage/ostler-assistant"
          chmod 755 "$stage/ostler-assistant"

          archive="ostler-assistant-aarch64-apple-darwin-v${version}.tar.gz"
          tar czf "$archive" -C "$stage" ostler-assistant

          # Sidecar SHA-256 so the installer can verify the download
          # before extracting. shasum is shipped on macOS by default.
          shasum -a 256 "$archive" | tee "${archive}.sha256"

          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=${archive}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Release is created if it does not already exist; the
          # tarball + checksum are attached as assets. CM051's
          # installer fetches the latest release artefact.
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.artifact.outputs.archive }}
            ${{ steps.artifact.outputs.checksum }}
          generate_release_notes: true
          # Mark v0.1 as a draft on first push so Andy can review
          # the auto-generated notes (and the unsigned-binary
          # warning below) before customers see anything. Once a
          # signed-build pipeline lands (task #136), flip to false.
          draft: true
          body: |
            ## Ostler assistant v${{ steps.version.outputs.version }} (Apple Silicon)

            **Unsigned binary**: this release ships unsigned. macOS
            Gatekeeper will quarantine the extracted binary on first
            run; the operator must explicitly allow it via System
            Settings -> Privacy & Security. Code-signing is queued
            under task #136 and lands in v0.2.

            **Architecture**: arm64 (Apple Silicon). Intel Macs are
            not supported in v0.1.

            **Verification**: a SHA-256 checksum file is attached
            alongside the tarball. Compare:

            ```
            shasum -a 256 ostler-assistant-aarch64-apple-darwin-v${{ steps.version.outputs.version }}.tar.gz
            ```

      # Sanity log: print the artefact references for any later
      # debugger pasting them into a curl without scrolling
      # through the build output.
      - name: Print published artefact references
        run: |
          echo "Published:"
          echo "  ${{ steps.artifact.outputs.archive }}"
          echo "  ${{ steps.artifact.outputs.checksum }}"
          echo "Tag: ${{ github.ref_name }}"
