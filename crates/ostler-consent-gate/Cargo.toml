[package]
name = "ostler-consent-gate"
description = "Read ~/.ostler/posture/consent.json and enforce consent before starting privacy-sensitive Ostler subsystems (whatsapp-bridge, cm041 voice ingestion)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
